<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Component</title>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .button {
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .button:hover {
        background: #1565c0;
        box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
      }

      .button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .button.outlined {
        background: transparent;
        color: #1976d2;
        border: 1px solid #1976d2;
      }

      .button.outlined:hover {
        background: rgba(25, 118, 210, 0.04);
      }

      .button.text {
        background: transparent;
        color: #1976d2;
        border: none;
      }

      .button.text:hover {
        background: rgba(25, 118, 210, 0.04);
      }

      .button.small {
        padding: 4px 8px;
        font-size: 12px;
      }

      .button.large {
        padding: 12px 24px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <button id="demo-button" class="button">Click me</button>

    <script>
      (function () {
        const SRC = "hub2color";
        let button = document.getElementById("demo-button");

        function updateButton() {
          const label = window.buttonProps?.label || "Click me";
          const variant = window.buttonProps?.variant || "contained";
          const disabled = window.buttonProps?.disabled || false;
          const size = window.buttonProps?.size || "medium";

          button.textContent = label;
          button.disabled = disabled;

          // Reset classes
          button.className = "button";

          // Apply variant
          if (variant === "outlined") button.classList.add("outlined");
          if (variant === "text") button.classList.add("text");

          // Apply size
          if (size === "small") button.classList.add("small");
          if (size === "large") button.classList.add("large");
        }

        function ensureStyleTag() {
          let tag = document.getElementById("injected-css");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "injected-css";
            document.head.appendChild(tag);
          }
          return tag;
        }

        function ensureScriptTag() {
          let tag = document.getElementById("injected-js");
          if (!tag) {
            tag = document.createElement("script");
            tag.id = "injected-js";
            document.body.appendChild(tag);
          }
          return tag;
        }

        function ensureThemeStyleTag() {
          let tag = document.getElementById("theme-styles");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "theme-styles";
            document.head.appendChild(tag);
          }
          return tag;
        }

        function ensureCssVariablesStyleTag() {
          let tag = document.getElementById("css-variables");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "css-variables";
            document.head.insertBefore(tag, document.head.firstChild);
          }
          return tag;
        }

        function applyTheme(theme) {
          if (!theme) return;

          const themeStyleTag = ensureThemeStyleTag();
          let css = "";

          function processThemeObject(obj, selector = ".button") {
            if (!obj || typeof obj !== "object") return;

            for (const [key, value] of Object.entries(obj)) {
              if (value && typeof value === "object" && !Array.isArray(value)) {
                // Handle nested objects like containedSizeSmall, containedPrimary, etc.
                let nestedSelector = selector;
                
                // Map theme keys to CSS selectors
                if (key.includes("containedSizeSmall")) {
                  nestedSelector = selector + ".small";
                } else if (key.includes("containedSizeMedium")) {
                  nestedSelector = selector + ":not(.small):not(.large)";
                } else if (key.includes("containedSizeLarge")) {
                  nestedSelector = selector + ".large";
                } else if (key.includes("containedPrimaryHover")) {
                  nestedSelector = selector + ".primary:hover";
                } else if (key.includes("containedPrimary")) {
                  nestedSelector = selector + ".primary";
                } else if (key.includes("containedSecondaryHover")) {
                  nestedSelector = selector + ".secondary:hover";
                } else if (key.includes("containedSecondary")) {
                  nestedSelector = selector + ".secondary";
                } else if (key.includes("containedErrorHover")) {
                  nestedSelector = selector + ".error:hover";
                } else if (key.includes("containedError")) {
                  nestedSelector = selector + ".error";
                } else if (key.includes("containedDisabled")) {
                  nestedSelector = selector + ":disabled";
                } else if (key.includes("containedHover")) {
                  nestedSelector = selector + ":hover";
                } else if (key.includes("contained")) {
                  nestedSelector = selector;
                }

                processThemeObject(value, nestedSelector);
              } else {
                // Handle CSS properties
                const cssProperty = key.replace(/([A-Z])/g, '-$1').toLowerCase();
                css += `${selector} { ${cssProperty}: ${value} !important; }\n`;
              }
            }
          }

          if (theme.button) {
            processThemeObject(theme.button);
          }

          themeStyleTag.textContent = css;
        }

        window.addEventListener("message", (e) => {
          const data = e.data || {};
          if (data && data.source === SRC) {
            switch (data.type) {
              case "APPLY_CSS":
                ensureStyleTag().textContent = data.payload?.css || "";
                break;
              case "APPLY_JS":
                const js = data.payload?.js || "";
                const s = ensureScriptTag();
                s.textContent = js;
                break;
              case "SET_DIR":
                document.documentElement.setAttribute(
                  "dir",
                  data.payload?.dir || "ltr",
                );
                break;
              case "CONTROLS_CHANGE":
                window.buttonProps = data.payload?.values || {};
                updateButton();
                break;
              case "BULK_CONTROLS":
                window.buttonProps = data.payload?.values || {};
                updateButton();
                break;
              case "THEME_CHANGE":
                applyTheme(data.payload?.theme);
                break;
              case "APPLY_CSS_VARIABLES":
                ensureCssVariablesStyleTag().textContent = data.payload?.css || "";
                break;
            }
          }
        });

        // Initialize
        if (!window.buttonProps) window.buttonProps = {};
        updateButton();
      })();
    </script>
  </body>
</html>
