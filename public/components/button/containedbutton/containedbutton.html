<!DOCTYPE html>
<html lang="en" class="desktop landscape">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub2Color wrapper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            text-size-adjust: none;
            -ms-text-size-adjust: none;
            -webkit-text-size-adjust: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        body {
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            text-rendering: optimizeSpeed;
            min-height: 100%;
        }

        a {
            text-decoration-skip-ink: auto;
        }

        input,
        select,
        textarea,
        button {
            font-family: inherit;
            font-size: 1rem;
        }

        input:focus,
        select:focus,
        textarea:focus,
        fieldset:focus {
            outline: none;
        }

        fieldset {
            border: 0;
            margin: 0;
            padding: 0;
        }

        ::-moz-focus-inner {
            border: 0;
            outline: 0;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill,
        textarea:-webkit-autofill:hover,
        textarea:-webkit-autofill:focus,
        select:-webkit-autofill,
        select:-webkit-autofill:hover,
        select:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--input-field-font-color);
            -webkit-box-shadow: 0 0 0 1000px var(--input-field-background-color) inset;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
    
        <link href="../../../components/button/containedbutton/containedbutton.css" rel="stylesheet" type="text/css">
    
    
        <script async defer src="../../../components/button/containedbutton/containedbutton.js"></script>
    
    <meta name="mui-style-insertion-point" content="">
    <style id="custom-variables-link"></style>
    <style id="custom-css-tag-styles"></style>
</head>
<body>
    <div id="application"></div>
</body>

</html>
