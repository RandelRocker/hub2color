<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Component</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .input-container {
        max-width: 300px;
        width: 100%;
      }

      .input-label {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
        font-weight: 500;
        color: #333;
      }

      .input-field {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }

      .input-field:focus {
        outline: none;
        border-color: #1976d2;
        box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
      }

      .input-field:disabled {
        background: #f5f5f5;
        color: #999;
      }

      .input-helper {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }

      .input-field.error {
        border-color: #d32f2f;
      }

      .input-helper.error {
        color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div class="input-container">
      <label id="input-label" class="input-label">Label</label>
      <input
        id="demo-input"
        class="input-field"
        type="text"
        placeholder="Enter text..."
      />
      <div id="input-helper" class="input-helper">Helper text</div>
    </div>

    <script>
      (function () {
        const SRC = "hub2color";
        let input = document.getElementById("demo-input");
        let label = document.getElementById("input-label");
        let helper = document.getElementById("input-helper");

        function updateInput() {
          const inputLabel = window.inputProps?.label || "Label";
          const placeholder = window.inputProps?.placeholder || "Enter text...";
          const helperText = window.inputProps?.helperText || "Helper text";
          const disabled = window.inputProps?.disabled || false;
          const error = window.inputProps?.error || false;

          label.textContent = inputLabel;
          input.placeholder = placeholder;
          helper.textContent = helperText;
          input.disabled = disabled;

          // Reset classes
          input.className = "input-field";
          helper.className = "input-helper";

          // Apply error state
          if (error) {
            input.classList.add("error");
            helper.classList.add("error");
          }
        }

        function ensureStyleTag() {
          let tag = document.getElementById("injected-css");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "injected-css";
            document.head.appendChild(tag);
          }
          return tag;
        }

        function ensureScriptTag() {
          let tag = document.getElementById("injected-js");
          if (!tag) {
            tag = document.createElement("script");
            tag.id = "injected-js";
            document.body.appendChild(tag);
          }
          return tag;
        }

        window.addEventListener("message", (e) => {
          const data = e.data || {};
          if (data && data.source === SRC) {
            switch (data.type) {
              case "APPLY_CSS":
                ensureStyleTag().textContent = data.payload?.css || "";
                break;
              case "APPLY_JS":
                const js = data.payload?.js || "";
                const s = ensureScriptTag();
                s.textContent = js;
                break;
              case "SET_DIR":
                document.documentElement.setAttribute(
                  "dir",
                  data.payload?.dir || "ltr",
                );
                break;
              case "CONTROL_CHANGE":
                if (!window.inputProps) window.inputProps = {};
                window.inputProps[data.payload?.name] = data.payload?.value;
                updateInput();
                break;
              case "BULK_CONTROLS":
                window.inputProps = data.payload?.values || {};
                updateInput();
                break;
            }
          }
        });

        // Initialize
        if (!window.inputProps) window.inputProps = {};
        updateInput();
      })();
    </script>
  </body>
</html>
