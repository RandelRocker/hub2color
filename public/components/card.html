<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Component</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        overflow: hidden;
      }

      .card-image {
        width: 100%;
        height: 200px;
        background: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 24px;
      }

      .card-content {
        padding: 16px;
      }

      .card-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: #333;
      }

      .card-description {
        color: #666;
        line-height: 1.5;
        margin: 0 0 16px 0;
      }

      .card-actions {
        display: flex;
        gap: 8px;
      }

      .card-button {
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .card-button:hover {
        background: #1565c0;
      }

      .card-button.secondary {
        background: transparent;
        color: #1976d2;
        border: 1px solid #1976d2;
      }

      .card-button.secondary:hover {
        background: rgba(25, 118, 210, 0.04);
      }

      .card.elevated {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }

      .card.outlined {
        box-shadow: none;
        border: 1px solid #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div id="demo-card" class="card">
      <div class="card-image">🖼️</div>
      <div class="card-content">
        <h2 id="card-title" class="card-title">Card Title</h2>
        <p id="card-description" class="card-description">
          This is a sample card description that explains what this card is
          about.
        </p>
        <div class="card-actions">
          <button class="card-button">Learn More</button>
          <button class="card-button secondary">Share</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const SRC = "hub2color";
        let card = document.getElementById("demo-card");
        let title = document.getElementById("card-title");
        let description = document.getElementById("card-description");

        function updateCard() {
          const cardTitle = window.cardProps?.title || "Card Title";
          const cardDescription =
            window.cardProps?.description ||
            "This is a sample card description that explains what this card is about.";
          const elevation = window.cardProps?.elevation || "default";
          const showImage = window.cardProps?.showImage !== false;

          title.textContent = cardTitle;
          description.textContent = cardDescription;

          // Reset classes
          card.className = "card";

          // Apply elevation
          if (elevation === "elevated") card.classList.add("elevated");
          if (elevation === "outlined") card.classList.add("outlined");

          // Toggle image visibility
          const imageEl = card.querySelector(".card-image");
          imageEl.style.display = showImage ? "flex" : "none";
        }

        function ensureStyleTag() {
          let tag = document.getElementById("injected-css");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "injected-css";
            document.head.appendChild(tag);
          }
          return tag;
        }

        function ensureScriptTag() {
          let tag = document.getElementById("injected-js");
          if (!tag) {
            tag = document.createElement("script");
            tag.id = "injected-js";
            document.body.appendChild(tag);
          }
          return tag;
        }

        window.addEventListener("message", (e) => {
          const data = e.data || {};
          if (data && data.source === SRC) {
            switch (data.type) {
              case "APPLY_CSS":
                ensureStyleTag().textContent = data.payload?.css || "";
                break;
              case "APPLY_JS":
                const js = data.payload?.js || "";
                const s = ensureScriptTag();
                s.textContent = js;
                break;
              case "SET_DIR":
                document.documentElement.setAttribute(
                  "dir",
                  data.payload?.dir || "ltr",
                );
                break;
              case "CONTROLS_CHANGE":
                window.cardProps = data.payload?.values || {};
                updateCard();
                break;
              case "BULK_CONTROLS":
                window.cardProps = data.payload?.values || {};
                updateCard();
                break;
            }
          }
        });

        // Initialize
        if (!window.cardProps) window.cardProps = {};
        updateCard();
      })();
    </script>
  </body>
</html>
