<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Grid Layout</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
      }

      .grid-container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .grid-title {
        text-align: center;
        font-size: 32px;
        font-weight: 600;
        color: #333;
        margin: 0 0 40px 0;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
        margin-bottom: 40px;
      }

      .product-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }

      .product-image {
        width: 100%;
        height: 200px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 48px;
      }

      .product-content {
        padding: 20px;
      }

      .product-title {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin: 0 0 8px 0;
      }

      .product-description {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 16px 0;
      }

      .product-price {
        font-size: 20px;
        font-weight: 700;
        color: #1976d2;
        margin: 0 0 16px 0;
      }

      .product-button {
        width: 100%;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .product-button:hover {
        background: #1565c0;
      }

      .grid-2-cols {
        grid-template-columns: repeat(2, 1fr);
      }
      .grid-3-cols {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .grid-4-cols {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      @media (max-width: 768px) {
        .product-grid {
          grid-template-columns: 1fr;
        }

        .grid-2-cols,
        .grid-3-cols,
        .grid-4-cols {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <h1 id="grid-title" class="grid-title">Featured Products</h1>
      <div id="product-grid" class="product-grid">
        <!-- Products will be generated by JavaScript -->
      </div>
    </div>

    <script>
      (function () {
        const SRC = "hub2color";
        let title = document.getElementById("grid-title");
        let grid = document.getElementById("product-grid");

        const products = [
          {
            id: 1,
            name: "Smart Watch",
            description: "Advanced fitness tracking",
            price: "$299",
            icon: "⌚",
          },
          {
            id: 2,
            name: "Wireless Headphones",
            description: "Premium sound quality",
            price: "$199",
            icon: "🎧",
          },
          {
            id: 3,
            name: "Tablet Pro",
            description: "Professional creativity tool",
            price: "$799",
            icon: "📱",
          },
          {
            id: 4,
            name: "Laptop Ultra",
            description: "High performance computing",
            price: "$1299",
            icon: "💻",
          },
          {
            id: 5,
            name: "Smart Speaker",
            description: "Voice-controlled assistant",
            price: "$149",
            icon: "🔊",
          },
          {
            id: 6,
            name: "Camera Lens",
            description: "Professional photography",
            price: "$599",
            icon: "📷",
          },
        ];

        function updateGrid() {
          const gridTitle = window.gridProps?.title || "Featured Products";
          const columns = window.gridProps?.columns || 3;
          const showPrices = window.gridProps?.showPrices !== false;

          title.textContent = gridTitle;

          // Update grid columns
          grid.className = "product-grid";
          if (columns === 2) grid.classList.add("grid-2-cols");
          if (columns === 3) grid.classList.add("grid-3-cols");
          if (columns === 4) grid.classList.add("grid-4-cols");

          // Generate products
          const productCount = Math.min(
            window.gridProps?.productCount || 6,
            products.length,
          );
          grid.innerHTML = "";

          for (let i = 0; i < productCount; i++) {
            const product = products[i];
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                        <div class="product-image">${product.icon}</div>
                        <div class="product-content">
                            <h3 class="product-title">${product.name}</h3>
                            <p class="product-description">${product.description}</p>
                            ${showPrices ? `<div class="product-price">${product.price}</div>` : ""}
                            <button class="product-button">Add to Cart</button>
                        </div>
                    `;
            grid.appendChild(card);
          }
        }

        function ensureStyleTag() {
          let tag = document.getElementById("injected-css");
          if (!tag) {
            tag = document.createElement("style");
            tag.id = "injected-css";
            document.head.appendChild(tag);
          }
          return tag;
        }

        function ensureScriptTag() {
          let tag = document.getElementById("injected-js");
          if (!tag) {
            tag = document.createElement("script");
            tag.id = "injected-js";
            document.body.appendChild(tag);
          }
          return tag;
        }

        window.addEventListener("message", (e) => {
          const data = e.data || {};
          if (data && data.source === SRC) {
            switch (data.type) {
              case "CUSTOM_CSS_CHANGE":
                ensureStyleTag().textContent = data.payload?.css || "";
                break;
              case "APPLY_JS":
                const js = data.payload?.js || "";
                const s = ensureScriptTag();
                s.textContent = js;
                break;
              case "SET_DIR":
                document.documentElement.setAttribute(
                  "dir",
                  data.payload?.dir || "ltr",
                );
                break;
              case "CONTROLS_CHANGE":
                window.gridProps = data.payload?.values || {};
                updateGrid();
                break;
              case "BULK_CONTROLS":
                window.gridProps = data.payload?.values || {};
                updateGrid();
                break;
            }
          }
        });

        // Initialize
        if (!window.gridProps) window.gridProps = {};
        updateGrid();
      })();
    </script>
  </body>
</html>
